name: Website checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm run lint && npm run build && npm test
      - run: git diff --exit-code -- '*.html' sitemap.xml robots.txt llms.txt
